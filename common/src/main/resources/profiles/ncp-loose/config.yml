# Optional NCP-style loose profile overlay.
# Copy these values into config.yml, or use them as a reference for compatibility-heavy servers.

config-flavor: V2
config-version: 11

compatibility:
    profile: ncp-loose
    gameplay:
        mode: monitor
        modify-packets: false
        setbacks: false
    safety:
        mode: enforce
    checks:
        # NCP allowed many combat/build/client modules, but movement hacks were still bounded by cancel/setback.
        Simulation:
            mode: enforce
            modify-packets: true
            setbacks: true
        Phase:
            mode: enforce
            modify-packets: true
            setbacks: true
        GroundSpoof:
            mode: monitor
            modify-packets: false
            setbacks: false
        MovementSpeed:
            mode: enforce
            modify-packets: true
            setbacks: false
        Flight:
            mode: monitor
            modify-packets: false
            setbacks: false
        NoSlow:
            mode: off
            modify-packets: false
            setbacks: false
        NoFall:
            mode: monitor
            modify-packets: false
            setbacks: false
        TimerA:
            mode: enforce
            modify-packets: true
            setbacks: true
        TimerLimit:
            mode: enforce
            modify-packets: true
            setbacks: true
        TickTimer:
            mode: monitor
            modify-packets: false
            setbacks: false
        VehicleTimer:
            mode: enforce
            modify-packets: true
            setbacks: true
        ElytraSpeed:
            mode: enforce
            modify-packets: true
            setbacks: true

Simulation:
    threshold: 0.34
    immediate-setback-threshold: 0.85
    max-advantage: 8
    setback-violation-threshold: 6
    use-normal-fluid-thresholds: true
    use-normal-airborne-thresholds: true
    normal-airborne-min-ticks: 20
    normal-airborne-vertical-speed: 0.42

MovementSpeed:
    max-horizontal-blocks-per-second: 60

Phase:
    setbackvl: 0
    flag-persistent-collisions: true

SetbackBlocker:
    block-movement-during-setback: true

NoSlow:
    setbackvl: -1

Knockback:
    immediate-setback-threshold: -1
    max-advantage: -1
    setbackvl: -1

Explosion:
    setbackvl: -1

TimerA:
    setbackvl: 10
    drift: 500
    allowed-timer-multiplier: 1.18
    cancel-packets: true

TimerLimit:
    setbackvl: 10
    allowed-timer-multiplier: 1.18
    ping-abuse-limit-threshold: 1000

VehicleTimer:
    setbackvl: 10
    cancel-packets: true

ElytraSpeed:
    max-horizontal-speed: 3.0
    max-ascending-speed: 2.5

Reach:
    block-impossible-hits: false
    max-distance: 4.2
    extra-distance: 0
    max-attacks-per-tick: 10
    max-attacks-per-tick-action: alert

AirLiquidPlace:
    cancelvl: -1

FarPlace:
    cancelvl: -1

PositionPlace:
    cancelvl: -1

RotationPlace:
    cancelvl: -1

FabricatedPlace:
    cancelvl: 5

exempt-elytra: true

exploit:
    cancel-invalid-elytra-start: false
    allow-building-on-ghostblocks: true
    allow-sprint-jumping-when-using-elytra: true

experimental-checks: false
packet-spam-threshold: -1
